apiVersion: v1
kind: Namespace
metadata:
  name: launchpad-reporting
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: launchpad-reporting
spec:
  hard:
    requests.storage: 5Gi
    persistentvolumeclaims: '2'
    pods: '6'
    limits.cpu: '3'
    limits.memory: 1Gi
    limits.ephemeral-storage: 512Mi
