name: Reporting service

on:
  pull_request:
    branches: [main]
    paths: ['reporting-service/**', '.github/workflows/reporting.yml']
  push:
    branches: [main, develop]
    paths: ['reporting-service/**', '.github/workflows/reporting.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected commit to GHCR after tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      node-image: ${{ steps.base.outputs.image }}
    defaults:
      run:
        working-directory: reporting-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reporting-service/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve official Node base
        id: base
        run: |
          digest=$(docker buildx imagetools inspect docker.io/library/node:24-bookworm-slim --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=docker.io/library/node:24-bookworm-slim@$digest" >> "$GITHUB_OUTPUT"
      - name: Build reporting container
        env:
          NODE_IMAGE: ${{ steps.base.outputs.image }}
        run: docker build --platform linux/amd64 --build-arg "NODE_IMAGE=$NODE_IMAGE" --tag launchpad-reporting:ci .

  publish:
    needs: test
    if: >-
      github.repository == 'Sjolus/vatsca-sweden-fir-launchpad' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: reporting-publish-${{ github.sha }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/sjolus/launchpad-reporting
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep existing commit tags unchanged
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR can deny a pull before the first push creates the package.
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/users/Sjolus/packages/container/launchpad-reporting")
          case "$status" in
            404) exit 0 ;;
            200) ;;
            *) printf 'Cannot check package existence (HTTP %s).\n' "$status" >&2; exit 1 ;;
          esac
          if manifest=$(docker buildx imagetools inspect "$IMAGE:git-$GITHUB_SHA" --format '{{json .Manifest}}' 2> "$RUNNER_TEMP/reporting-inspect.err"); then
            digest=$(jq -r '.digest' <<< "$manifest")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            error=$(< "$RUNNER_TEMP/reporting-inspect.err")
            if [[ "$error" != *": not found"* && "$error" != *"manifest unknown"* && "$error" != *"404 Not Found"* ]]; then
              printf '%s\n' "$error" >&2
              exit 1
            fi
          fi
      - name: Publish reporting container
        id: image
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: reporting-service
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sjolus/launchpad-reporting:git-${{ github.sha }}
          build-args: NODE_IMAGE=${{ needs.test.outputs.node-image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ needs.test.outputs.node-image }}
      - name: Record deployment image
        env:
          DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
          EXISTING: ${{ steps.existing.outputs.digest }}
          NODE_IMAGE: ${{ needs.test.outputs.node-image }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Deployment image: `%s@%s`\n\nSource commit: `%s`\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$EXISTING" ]]; then
            printf '\nExisting commit image reused; its tag was not overwritten.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNode base: `%s`\n' "$NODE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nPublication does not deploy the service.\n' >> "$GITHUB_STEP_SUMMARY"
