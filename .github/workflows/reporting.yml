name: Reporting service

on:
  pull_request:
    branches: [main]
    paths: ['reporting-service/**', '.github/workflows/reporting.yml']
  push:
    branches: [main, develop]
    paths: ['reporting-service/**', '.github/workflows/reporting.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporting-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: reporting-service/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build reporting container
        run: docker build --tag launchpad-reporting:ci .
